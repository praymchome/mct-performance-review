<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fevereiro Roxo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #1a1a2e;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Arial Black', 'Impact', Arial, sans-serif;
}

.stage {
  width: 390px;
  height: 690px;
  background: #F0EFF6;
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.5);
}

/* ── Keyframes ── */

@keyframes fadeSlideLeft {
  from { opacity:0; transform: translateX(-50px); }
  to   { opacity:1; transform: translateX(0); }
}

@keyframes popScale {
  0%   { opacity:0; transform: scale(0.5); }
  70%  { opacity:1; transform: scale(1.08); }
  100% { opacity:1; transform: scale(1); }
}

@keyframes bounceUp {
  0%   { opacity:0; transform: translateY(35px); }
  60%  { opacity:1; transform: translateY(-8px); }
  80%  { transform: translateY(4px); }
  100% { opacity:1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity:0; }
  to   { opacity:1; }
}

@keyframes strokeDraw {
  from { stroke-dashoffset: var(--len); }
  to   { stroke-dashoffset: 0; }
}

@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50%       { transform: scale(1.05); }
}

@keyframes arrowSlide {
  from { opacity:0; transform: scaleX(0); transform-origin: left center; }
  to   { opacity:1; transform: scaleX(1); transform-origin: left center; }
}

/* ── SVG ribbon layers ── */
.ribbons {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.rib-top {
  --len: 750;
  stroke-dasharray: 750;
  stroke-dashoffset: 750;
  animation: strokeDraw 1.4s cubic-bezier(.4,0,.2,1) 0.1s forwards;
  transform-origin: 370px 90px;
}
.rib-top-breathe {
  animation: strokeDraw 1.4s cubic-bezier(.4,0,.2,1) 0.1s forwards,
             breathe 3s ease-in-out 2s infinite;
  transform-origin: 370px 90px;
}

.rib-mid {
  --len: 520;
  stroke-dasharray: 520;
  stroke-dashoffset: 520;
  animation: strokeDraw 1.6s cubic-bezier(.4,0,.2,1) 0.4s forwards;
}

.rib-bot {
  --len: 320;
  stroke-dasharray: 320;
  stroke-dashoffset: 320;
  animation: strokeDraw 1.2s cubic-bezier(.4,0,.2,1) 0.7s forwards;
}

/* ── Typography ── */
.text-block {
  position: absolute;
  top: 115px;
  left: 48px;
}

.line-feve {
  font-size: 74px;
  font-weight: 900;
  color: #9B8EC4;
  letter-spacing: -2px;
  line-height: 1;
  opacity: 0;
  animation: fadeSlideLeft 0.65s cubic-bezier(.22,1,.36,1) 0.5s forwards;
}

.line-reiro {
  font-size: 74px;
  font-weight: 900;
  color: #8B7BBB;
  letter-spacing: -2px;
  line-height: 1;
  opacity: 0;
  animation: fadeSlideLeft 0.65s cubic-bezier(.22,1,.36,1) 0.82s forwards;
}

.line-roxo {
  font-size: 82px;
  font-weight: 900;
  color: #3D2CB5;
  letter-spacing: -3px;
  line-height: 1;
  opacity: 0;
  animation: popScale 0.55s cubic-bezier(.34,1.56,.64,1) 1.7s forwards;
}

/* Cursive scribble */
.scribble-wrap {
  position: absolute;
  top: 189px;
  left: 28px;
  width: 330px;
  height: 60px;
  pointer-events: none;
}

.scribble-path {
  --len: 620;
  stroke-dasharray: 620;
  stroke-dashoffset: 620;
  animation: strokeDraw 0.9s cubic-bezier(.4,0,.2,1) 1.1s forwards;
}

/* ── Icons ── */
.icons-row {
  position: absolute;
  top: 408px;
  left: 48px;
  display: flex;
  gap: 14px;
}

.icon-circle {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  border: 2px solid #5A4B9E;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
}

.ic1 { animation: bounceUp 0.55s ease-out 2.2s forwards; }
.ic2 { animation: bounceUp 0.55s ease-out 2.4s forwards; }
.ic3 { animation: bounceUp 0.55s ease-out 2.6s forwards; }

.icon-circle svg {
  width: 36px;
  height: 36px;
  stroke: #5A4B9E;
  fill: none;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── Body text ── */
.body-text {
  position: absolute;
  top: 496px;
  left: 48px;
  width: 220px;
  font-size: 14.5px;
  font-family: Arial, sans-serif;
  font-weight: 400;
  line-height: 1.55;
  color: #4A3F7A;
  opacity: 0;
  animation: fadeIn 0.7s ease-out 2.85s forwards;
}

.body-text strong {
  font-weight: 700;
  color: #2D1E8E;
}

/* ── Arrow ── */
.arrow-wrap {
  position: absolute;
  top: 580px;
  left: 48px;
  opacity: 0;
  animation: arrowSlide 0.5s ease-out 3.3s forwards;
}

/* ── Footer ── */
.footer {
  position: absolute;
  bottom: 52px;
  left: 48px;
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  animation: fadeIn 0.5s ease-out 3.8s forwards;
}

.footer-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #4B2FD5;
  flex-shrink: 0;
}

.footer-text {
  font-size: 14px;
  font-family: Arial, sans-serif;
  color: #4A3F7A;
  font-weight: 500;
  letter-spacing: 0.3px;
}
</style>
</head>
<body>
<div class="stage">

  <!-- Decorative ribbons -->
  <div class="ribbons">
    <svg viewBox="0 0 390 690" width="390" height="690" xmlns="http://www.w3.org/2000/svg">
      <circle class="rib-top" cx="370" cy="90" r="110"
        fill="none" stroke="#A89ED0" stroke-width="38" opacity="0.75"/>

      <path class="rib-mid"
        d="M430,340 C390,290 310,325 338,405 C366,485 448,472 415,542 C382,612 294,600 300,655"
        fill="none" stroke="#7B6CE8" stroke-width="46" stroke-linecap="round" opacity="0.85"/>

      <path class="rib-bot"
        d="M320,615 C392,600 432,658 384,700 C345,732 272,712 282,680"
        fill="none" stroke="#A89ED0" stroke-width="36" stroke-linecap="round" opacity="0.65"/>
    </svg>
  </div>

  <!-- Typography -->
  <div class="text-block">
    <div class="line-feve">feve</div>
    <div class="line-reiro">reiro</div>
    <div class="line-roxo">roxo</div>
  </div>

  <!-- Cursive scribble over "reiro" -->
  <div class="scribble-wrap">
    <svg viewBox="0 0 330 60" xmlns="http://www.w3.org/2000/svg" overflow="visible">
      <path class="scribble-path"
        stroke="#3D2CB5" stroke-width="2.8" fill="none"
        stroke-linecap="round" stroke-linejoin="round"
        d="M6,38 C22,18 52,52 84,30 C116,8 142,50 178,28 C214,6 242,46 272,26 C292,14 312,42 330,28"/>
    </svg>
  </div>

  <!-- Icons -->
  <div class="icons-row">
    <!-- Brain (Alzheimer) -->
    <div class="icon-circle ic1">
      <svg viewBox="0 0 36 36">
        <path d="M18,7 C14,7 11,10 11,14 C11,15.5 11.5,16.8 12.5,17.8 C11.2,18.5 10,20 10,22 C10,25 12.5,27 15.5,27 L20.5,27 C23.5,27 26,25 26,22 C26,20 24.8,18.5 23.5,17.8 C24.5,16.8 25,15.5 25,14 C25,10 22,7 18,7Z"/>
        <line x1="18" y1="8" x2="18" y2="26"/>
        <path d="M13,15 Q15.5,17 18,16"/>
        <path d="M23,15 Q20.5,17 18,16"/>
        <text x="7" y="9" font-size="5.5" fill="#5A4B9E" stroke="none" font-family="Arial">??</text>
      </svg>
    </div>
    <!-- Spine (Fibromialgia) -->
    <div class="icon-circle ic2">
      <svg viewBox="0 0 36 36">
        <line x1="18" y1="5" x2="18" y2="31"/>
        <rect x="13" y="7"  width="10" height="5" rx="2.5"/>
        <rect x="13" y="14" width="10" height="5" rx="2.5"/>
        <rect x="13" y="21" width="10" height="5" rx="2.5"/>
        <line x1="9"  y1="9.5"  x2="13" y2="9.5"/>
        <line x1="23" y1="9.5"  x2="27" y2="9.5"/>
        <line x1="9"  y1="16.5" x2="13" y2="16.5"/>
        <line x1="23" y1="16.5" x2="27" y2="16.5"/>
        <line x1="9"  y1="23.5" x2="13" y2="23.5"/>
        <line x1="23" y1="23.5" x2="27" y2="23.5"/>
      </svg>
    </div>
    <!-- Face (Lúpus) -->
    <div class="icon-circle ic3">
      <svg viewBox="0 0 36 36">
        <circle cx="18" cy="16" r="10"/>
        <circle cx="14" cy="14" r="1.5" fill="#5A4B9E" stroke="none"/>
        <circle cx="22" cy="14" r="1.5" fill="#5A4B9E" stroke="none"/>
        <path d="M13,21 Q18,25 23,21"/>
        <!-- butterfly rash -->
        <path d="M11,16.5 C13,13.5 16,15 18,16 C20,15 23,13.5 25,16.5 C23,19 20,17.5 18,16 C16,17.5 13,19 11,16.5Z"
          fill="#C084FC" stroke="none" opacity="0.45"/>
      </svg>
    </div>
  </div>

  <!-- Body text -->
  <div class="body-text">
    Mês de conscientização<br>sobre <strong>Alzheimer,<br>fibromialgia e lúpus.</strong>
  </div>

  <!-- Arrow -->
  <div class="arrow-wrap">
    <svg width="100" height="20" viewBox="0 0 100 20">
      <line x1="0" y1="10" x2="86" y2="10" stroke="#3D2CB5" stroke-width="2"/>
      <polyline points="76,3 89,10 76,17" stroke="#3D2CB5" stroke-width="2" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-dot"></div>
    <div class="footer-text">/empresa</div>
  </div>

</div>
</body>
</html>
